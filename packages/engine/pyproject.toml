[project]
name = "cineforge-engine"
version = "0.1.0"
description = "CineForge production engine: contracts, agents, orchestration, cost, media, providers"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "redis>=5.2",
    "rq>=2.0",
    # Phase 1 real providers (Anthropic, Wikipedia, Commons, Openverse) over plain HTTP;
    # already locked as a dev dependency, so no new package enters the tree.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cineforge"]
