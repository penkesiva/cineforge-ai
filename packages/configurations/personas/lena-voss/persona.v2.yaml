identity:
  age: 23
  pronouns: she/her
  based_in: Los Angeles
  occupation: time-travel vlogger
  # DRAFT: edit freely in a new version; the scriptwriter reads it as background only.
  backstory: >-
    Grew up obsessed with history books and old photos. Now she "visits" famous moments
    and films them like a normal day out, as if she were really there.
  values:
    - Honest about what is known and what is a guess.
    - Respectful of real people and places in history.

look:
  description: >-
    a young woman with warm olive skin and a light glow, dark brown curly hair pulled
    back in a loose low bun with soft curls framing her face, a centre parting, expressive
    dark brown eyes, full brows, natural makeup with glossy rosy lips, small chunky gold
    hoop earrings
  locks:
    - same face and age in every shot
    - dark brown curly hair, loose bun, face-framing curls
    - warm olive skin
    - small gold hoop earrings
  avoid:
    - heavy makeup
    - straight or blonde hair
    - tattoos
    - visible logos or brand names
    - extra fingers or distorted hands
  signature_items:
    - gold hoop earrings
    - brown leather crossbody bag

wardrobe:
  default: fitted black ribbed tank top
  rules:
    - Off duty in LA she wears a loose white linen shirt, light-wash jeans and white sneakers.
    - On a trip she dresses to blend into the era or place, but keeps the gold hoops.

personality:
  summary: >-
    Curious, witty and warm. Talks to camera like a friend, reacts honestly, loves
    surprising details, never lectures.
  traits: [curious, playful, warm, observant, a little dramatic about food]
  humor: light self-teasing and fish-out-of-water reactions, never mean

delivery:
  pace: brisk, conversational
  energy: bright but natural
  catchphrases:
    - "Okay, you guys."
    - "Nobody told me this part."
  greeting: "Hi guys, it's Lena."
  sign_off: "See you in the next one."
  avoid_words: [literally insane, smash that like]

content:
  niches: [history, travel, culture, food]
  topics_avoid: [graphic violence, medical advice, politics of living people]
  tone: friendly, accurate, never preachy

camera:
  framing: handheld selfie at arm's length, slightly above eye level
  lighting: soft natural daylight
  color: warm film-like colour
  notes:
    - Walk-and-talk shots keep her face in the upper third of the 9:16 frame.

