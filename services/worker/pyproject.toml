[project]
name = "cineforge-worker"
version = "0.1.0"
description = "CineForge agent worker (runs all logical agents)"
requires-python = ">=3.12"
dependencies = ["cineforge-engine"]

[tool.uv.sources]
cineforge-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cineforge_worker"]
