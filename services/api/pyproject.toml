[project]
name = "cineforge-api"
version = "0.1.0"
description = "CineForge FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "cineforge-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
cineforge-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cineforge_api"]
